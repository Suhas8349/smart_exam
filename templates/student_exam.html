<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{{ subject_name }} — Exam in Progress</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<style>
  .exam-topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 28px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .exam-topbar h1 { font-size: 18px; margin: 0; font-weight: 600; font-family: var(--font-display); }
  .exam-topbar .meta { font-size: 13px; color: var(--text-muted); margin-top: 2px; font-family: var(--font-mono); }

  .exam-wrap {
    max-width: 900px;
    margin: 28px auto 120px;
    padding: 0 20px;
  }

  .question-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 22px 24px;
    margin-bottom: 18px;
  }
  .q-number {
    font-size: 12px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 8px;
    font-family: var(--font-mono);
  }
  .q-text { font-size: 16px; line-height: 1.5; margin-bottom: 16px; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .option:hover { border-color: #3d4766; background: var(--surface-2); }
  .option input { accent-color: var(--accent); }
  .option label { cursor: pointer; flex: 1; font-size: 14.5px; }

  .submit-bar {
    display: flex;
    justify-content: flex-end;
    margin-top: 20px;
  }
</style>
</head>
<body>

<div class="exam-topbar">
  <div>
    <h1>{{ subject_name }} ({{ subject_code }})</h1>
    <div class="meta">Exam ID: {{ exam_id }} &nbsp;&middot;&nbsp; Instructor: {{ teacher_name }}</div>
  </div>
</div>

<form id="examForm" action="{{ url_for('submit_exam', exam_id=exam_id) }}" method="POST">
  <div class="exam-wrap">
    {% for q in questions %}
    <div class="question-card">
      <div class="q-number">Question {{ q.number }}</div>
      <div class="q-text">{{ q.question }}</div>
      <div class="options">
        <div class="option">
          <input type="radio" name="question_{{ q.number }}" value="A" id="q{{ q.number }}a">
          <label for="q{{ q.number }}a">{{ q.option_a }}</label>
        </div>
        <div class="option">
          <input type="radio" name="question_{{ q.number }}" value="B" id="q{{ q.number }}b">
          <label for="q{{ q.number }}b">{{ q.option_b }}</label>
        </div>
        <div class="option">
          <input type="radio" name="question_{{ q.number }}" value="C" id="q{{ q.number }}c">
          <label for="q{{ q.number }}c">{{ q.option_c }}</label>
        </div>
        <div class="option">
          <input type="radio" name="question_{{ q.number }}" value="D" id="q{{ q.number }}d">
          <label for="q{{ q.number }}d">{{ q.option_d }}</label>
        </div>
      </div>
    </div>
    {% endfor %}

    <div class="submit-bar">
      <button type="submit" id="submitBtn" class="btn btn-primary">Submit Exam</button>
    </div>
  </div>
</form>

<!--
  NOTE: No camera, recording, self-view, or fullscreen JavaScript
  belongs in this file. student_app.py automatically injects all
  of that into every /student/exam/<id> page on the server side.
  Adding it here again causes duplicate camera requests and conflicts.
-->

</body>
</html>
